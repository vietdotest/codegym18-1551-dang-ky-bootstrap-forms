<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký với Bootstrap Forms</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><link rel="stylesheet" href="style.css"></head><body><main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-lg-7"><h1 class="text-center mb-3">Đăng ký người dùng</h1><p class="text-muted text-center">Nhập thông tin mẫu để thử biểu mẫu. Mật khẩu tối thiểu 8 ký tự.</p><form><div class="mb-3"><label for="fullname" class="form-label">Họ và tên</label><input id="fullname" name="fullname" class="form-control" required autocomplete="name"></div><div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email" class="form-control" required autocomplete="email"></div><div class="row"><div class="col-md-6 mb-3"><label for="password" class="form-label">Mật khẩu</label><input id="password" name="password" type="password" class="form-control" minlength="8" required autocomplete="new-password"></div><div class="col-md-6 mb-3"><label for="confirm" class="form-label">Xác nhận mật khẩu</label><input id="confirm" name="confirm" type="password" class="form-control" minlength="8" required autocomplete="new-password"></div></div><fieldset class="mb-3"><legend class="fs-6">Giới tính</legend><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="genderNam" value="Nam"><label class="form-check-label" for="genderNam">Nam</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="genderNữ" value="Nữ"><label class="form-check-label" for="genderNữ">Nữ</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="genderKhác" value="Khác"><label class="form-check-label" for="genderKhác">Khác</label></div></fieldset><fieldset class="mb-3"><legend class="fs-6">Sở thích</legend><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="hobby" id="hobby0" value="Đọc sách"><label class="form-check-label" for="hobby0">Đọc sách</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="hobby" id="hobby1" value="Thể thao"><label class="form-check-label" for="hobby1">Thể thao</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="hobby" id="hobby2" value="Lập trình"><label class="form-check-label" for="hobby2">Lập trình</label></div></fieldset><div class="mb-4"><label class="form-label" for="country">Quốc gia</label><select id="country" name="country" class="form-select"><option>Việt Nam</option><option>Nhật Bản</option><option>Hoa Kỳ</option></select></div><button class="btn btn-primary w-100" type="submit">Đăng ký</button></form><p id="status" role="status" class="mt-3"></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="script.js"></script></body></html>
